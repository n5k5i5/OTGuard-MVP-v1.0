[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otguard"
version = "2.0.0.dev1"
description = "OTGuard - Operational Technology & ICS/SCADA Security Testing Framework (Lab-first, safe emulation)"
authors = [{name = "n5k5i5"}]
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0.1",
  "rich>=13.7",
]
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
urls = { 
  "Homepage" = "https://github.com/n5k5i5/OTGuard",
  "Repository" = "https://github.com/n5k5i5/OTGuard",
  "Issues" = "https://github.com/n5k5i5/OTGuard/issues"
}

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "build>=1.2.1",
]

[project.scripts]
otguard = "framework.cli.main:app"
framework = "framework.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.setuptools.package-data]
framework = ["bundled/**/*"]